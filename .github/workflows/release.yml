name: Release
# Manual-only: dispatch with a version. One component, one version line, plain
# semver tags — the library and the npm package are consumed by version rather
# than by download, so only gnofacilitator is released here.
#
# The tag is what `go get github.com/gnoverse/x402@vX.Y.Z` resolves, so this
# workflow versions the library too, even though it builds only the facilitator.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.2.0 (v prefix optional)"
        required: true
        type: string
permissions: {} # the job declares exactly what it needs
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the tag, create the release, upload archives
      packages: write # push the image to ghcr.io
      id-token: write # sign the build provenance attestation (keyless OIDC)
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }

      - name: Validate the version and compute the tag
        env:
          RAW_VERSION: ${{ inputs.version }} # via env, never inlined: injection hygiene
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::invalid version '$RAW_VERSION' (want X.Y.Z or X.Y.Z-pre)"
            exit 1
          fi
          tag="v$version"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists; to re-release, delete it first: git push --delete origin ${tag}"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/gnoverse/gnofacilitator" >> "$GITHUB_ENV"

      # A release must not ship a facilitator that fails its own tests, and the
      # e2e is the only thing that proves a payment settles.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.5' }
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with: { node-version: '24' }
      - run: go test ./...
      - run: make test-e2e

      # All fallible setup runs BEFORE the tag push: nothing that can fail may sit
      # between the tag push and goreleaser, so a setup failure cannot strand a tag.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest the release archives
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/checksums.txt

      - name: Collect the pushed image digest
        id: imgdigest
        run: |
          set -euo pipefail
          # dockers_v2 emits one "Docker Image" per pushed tag; the multi-arch index
          # for the version tag carries .extra.Digest. Match the exact versioned name
          # to grab the index rather than a per-arch entry or the :latest duplicate —
          # attesting the index digest covers every tag.
          digest="$(jq -r --arg img "${IMAGE}:${VERSION}" '
            [ .[] | select(.type == "Docker Image" and .name == $img) | .extra.Digest ]
            | unique | .[0] // empty' dist/artifacts.json)"
          if [ -z "$digest" ]; then
            echo "::error::could not resolve the image digest from dist/artifacts.json"
            jq -r '.[] | select(.type | test("Docker")) | .type + "  " + .name + "  " + (.extra.Digest // "-")' dist/artifacts.json
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.imgdigest.outputs.digest }}
          push-to-registry: true
